<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jordan Parra</title>
    
    {{ $style := resources.Get "css/kawaii.css" | resources.Minify }}
    <link rel="stylesheet" href="{{ $style.Permalink }}">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <meta name="description" content="{{ .Description | default .Site.Params.description }}">
    <meta name="author" content="{{ .Site.Params.author }}">
    
    {{ if .Site.Params.favicon }}
    <link rel="icon" href="{{ .Site.Params.favicon | relURL }}" type="image/png">
    {{ end }}
</head>
<body>
    <main class="kawaii-main">
        <div class="kawaii-posts-grid">
            {{ range .Pages}}
                <article class="kawaii-post-card">
                    <a href="{{.RelPermalink}}">
                        <div class="kawaii-card-content">
                            <div class="kawaii-card-text">
                                <h2 class="kawaii-card-title">
                                        {{.Params.Lang}}
                                </h2>
                            </div>
                        </div> 
                    </a>
                </article>
            {{end}}
        </div>
    </main>
</body>
</html>
